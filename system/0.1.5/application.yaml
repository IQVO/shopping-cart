# shopping-cart 0.1.5 (v0.1.5, 51976ab) - System Assets & Interaction Standard v0.4
apiVersion: warehouse/application/v1
application:
  id: shopping-cart
  name: Shopping Cart
  kind: bounded-context
  version: 0.1.5
  description: Shopping cart - cart lines, delivery quotes and a labelled cost estimate; consumes offer-availability,
    pricing and checkout events and publishes cart analytics events from the transactional outbox on retailnetwork.shopping-cart.analytics
  repository: https://github.com/IQVO/shopping-cart
  owners:
  - claudioed
  lifecycle: production
subdomain:
  id: storefront
  name: Digital Storefront
  summary: 'The digital storefront: a separate domain inside the retail-network organization that owns
    what a shopper sees, holds in a cart, pays and is charged.'
boundedContext:
  id: shopping-cart
  name: Shopping Cart
  classification: Supporting
  tier: Digital Storefront, storefront tier
  purpose: 'Holds a shopper''s intent: cart lines, the destination postal prefix, the delivery quote delivery-promise
    returned for the cart (per shipment group, with its offers and expiry), the shopper''s tier selection
    per group, and a labelled, non-binding estimate (effective prices + selected tier charges + tax band)
    so the total cost is visible up front.'
  publishes:
  - retailnetwork.shopping-cart.analytics
tags:
- cart
- line
- delivery
assets: system-assets.yaml
interactions: interactions.yaml
