# Default values for shopping-cart. One component: the api Deployment (cmd/api:
# REST, the outbox relay, the three Kafka consumers - offer-availability,
# pricing, checkout - and the two clock-driven sweep policies in one process).
# The chart refuses to render without the mandatory values below (named in the
# failure): database.*, kafka.brokers, deliveryPromise.url and the three
# config.*ConsumerGroup values.

replicaCount: 1

# The image is built from this repository's Dockerfile (ENTRYPOINT ./api,
# user 1000, port 8080, root filesystem never written).
image:
  repository: warehouse/shopping-cart
  pullPolicy: IfNotPresent
  # Empty = "v" + the chart's appVersion (the release job tags the image v<version>).
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# The image runs as uid/gid 1000 (Dockerfile USER 1000).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Optional exposure, default off. Both route to the api Service only.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: shopping-cart.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

gatewayApi:
  enabled: false
  parentRefs:
    - name: ""
      namespace: ""
      sectionName: "http"
  hosts:
    - path: /
      pathType: PathPrefix
  stripPath: true

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# HorizontalPodAutoscaler (autoscaling/v2), default off. When enabled the
# Deployment omits replicas so the HPA owns them. N>1 is safe for the outbox
# relay (row claims), the version-guarded writes (concurrent-update on
# conflict) and the consumers (stable groups, inbox dedupe on the CloudEvents
# id in the same transaction); it has not been load-tested.
autoscaling:
  api:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

# Environment read by cmd/api (cmd/api/config.go, cmd/api/main.go). Every key
# maps 1:1 to one variable; nothing else is rendered.
config:
  httpAddr: ":8080"                    # HTTP_ADDR (its port must equal service.targetPort)
  logLevel: "info"                     # LOG_LEVEL: debug | info | warn (or warning) | error
  # CART_CURRENCY: the estimate currency when no priced item states one.
  # Empty = not rendered; the binary defaults to USD.
  cartCurrency: ""
  # ABANDON_SWEEP_INTERVAL: how often the AbandonInactive policy runs (Go
  # duration). Empty = not rendered; the binary defaults to 1h.
  abandonSweepInterval: ""
  # PURGE_SWEEP_INTERVAL: how often the PurgeAbandonedCarts policy runs (Go
  # duration). Empty = not rendered; the binary defaults to 6h.
  purgeSweepInterval: ""
  # The three consumers always run under STABLE, service-prefixed group ids
  # that come from here, never from the pod name (a rescheduled pod must
  # resume from its committed offsets). REQUIRED; the chart refuses an empty
  # one and refuses *_CONSUMER_GROUP in extraEnv.
  # Suggested: shopping-cart-offer-availability, shopping-cart-pricing,
  # shopping-cart-checkout.
  offerAvailabilityConsumerGroup: ""   # OFFER_AVAILABILITY_CONSUMER_GROUP
  pricingConsumerGroup: ""             # PRICING_CONSUMER_GROUP
  checkoutConsumerGroup: ""            # CHECKOUT_CONSUMER_GROUP
  # OUTBOX_RELAY_INTERVAL: Go duration or plain seconds. Empty = not rendered
  # (the binary defaults to 1s).
  outboxRelayInterval: ""
  # OUTBOX_MAX_ATTEMPTS: failures before the relay excludes an outbox row so a
  # poison row cannot block it; re-arm with
  # `UPDATE outbox_events SET attempts = 0 WHERE id = ...`. 0 = unlimited.
  outboxMaxAttempts: 20
  # SHUTDOWN_DRAIN_DELAY: wait after /readyz flips before the listener closes.
  # Empty = not rendered (the binary defaults to 5s). Whole seconds ("5s"),
  # minutes ("1m") or "0"; the chart needs the number to size the grace period.
  shutdownDrainDelay: ""

# DELIVERY_PROMISE_URL is MANDATORY: the cart calls delivery-promise to quote
# delivery offers (QuoteDeliveryOffers); cmd/api exits at boot without it.
deliveryPromise:
  url: ""
  # DELIVERY_PROMISE_TIMEOUT: per-call timeout (Go duration). Empty = not
  # rendered; the binary defaults to 5s.
  timeout: ""

# The chart refuses to render unless database.url or database.existingSecret is
# set. DATABASE_URL always comes from a Secret (secretKeyRef), never from the
# ConfigMap.
database:
  # A DSN the chart stores in a Secret it creates. Prefer existingSecret.
  url: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"
  # Key, in the same Secret, of a DIRECT (non-pooled, session-mode) DSN used only
  # for the boot migrations (MIGRATIONS_DATABASE_URL), `optional: true` so a
  # Secret without it still starts the pod (the binary falls back to
  # DATABASE_URL). With database.url set, migrationsUrl fills it.
  migrationsExistingSecretKey: "MIGRATIONS_DATABASE_URL"
  migrationsUrl: ""

# KAFKA_BROKERS (comma-separated) is MANDATORY: the outbox relay, the consumers
# and /readyz dial Kafka. Produced topic: retailnetwork.shopping-cart.analytics;
# consumed: retailnetwork.offer-availability.events, retailnetwork.pricing.events
# and retailnetwork.checkout.events (dead letters on <topic>.dlq).
kafka:
  brokers: ""

# Extra env vars appended to the api container as a raw list. The chart refuses
# any *_MODE variable (this service has no mode: Postgres and Kafka are the only
# runtime), any variable the chart renders itself and any *_CONSUMER_GROUP (the
# group ids are the config.* values).
extraEnv: []

# The Postgres dial and the migrations at boot run inside a bounded retry
# (internal/bootretry), so the startup probe allows ~60s.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

# A2A (Agent2Agent) agent (cmd/a2a, ADR 0006): a second driving adapter over the
# SAME read use cases as GET /carts/{cartId} and GET /carts. Skills (both reads):
# get_cart and list_shopper_carts. READ-ONLY: it writes nothing, so it needs no
# Kafka, no outbox, no consumers and no delivery-promise, it exposes exactly what
# the REST GETs expose, and it calls no other context. It reads the same Postgres
# as the api (database.* above). Off by default; warehouse-infra turns it on. A2A
# carries delegation only; facts between contexts still travel as CloudEvents on
# Kafka.
a2a:
  enabled: false
  replicaCount: 1
  # A2A_ADDR the binary listens on; its port must equal a2a.service.targetPort.
  # (8080 is the api, so 8093 like the rest of the fleet's A2A agents.)
  httpAddr: ":8093"
  # Absolute URL advertised on the Agent Card (A2A_AGENT_URL, mandatory for the
  # binary). Empty defaults to this release's in-cluster Service DNS
  # (http://<release>-a2a.<ns>.svc.cluster.local:8093/); warehouse-infra can
  # override it with the gateway path when the agent must be reachable off-cluster.
  agentUrl: ""
  service:
    type: ClusterIP
    port: 8093
    targetPort: 8093
  # Gateway exposure of the A2A agent (a2a-route.yaml): host path
  # /api/a2a/shopping-cart rewritten to / (JSON-RPC root; the well-known agent
  # card stays reachable under the same prefix). Off by default; warehouse-infra
  # turns it on with the real parentRefs.
  route:
    enabled: false
    path: "/api/a2a/shopping-cart"
    parentRefs:
      - name: ""
        namespace: ""
        sectionName: "http"
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Room for the binary's sequential graceful shutdown (cmd/api/main.go):
# SHUTDOWN_DRAIN_DELAY (5s) + HTTP drain (10s) + the three consumers and two
# sweep policies awaited up to 10s each (50s) + the outbox relay (10s) = 75s
# worst case. The chart refuses anything that does not exceed that sum for the
# configured drain delay (a shorter period SIGKILLs a consumer, a sweep or the
# relay mid-drain).
terminationGracePeriodSeconds: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Observability (fleet standard): pod --OTLP/gRPC--> Collector --> Jaeger
# (traces) and Prometheus (metrics). Export never blocks; otel.enabled=false
# renders no OTEL_* env at all (the binary then falls back to localhost:4317).
# SERVICE_VERSION is the image tag (appVersion when empty).
otel:
  enabled: true
  endpoint: "otel-collector.observability.svc.cluster.local:4317"
  serviceName: "shopping-cart"
