{{- if .Values.a2a.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shopping-cart.a2aFullname" . }}
  labels:
    {{- include "shopping-cart.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
spec:
  type: {{ .Values.a2a.service.type }}
  ports:
    - port: {{ .Values.a2a.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  # component=a2a pins the Service to the a2a Deployment's pods
  # (tests/test_service_selectors.py).
  selector:
    {{- include "shopping-cart.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
{{- end }}
