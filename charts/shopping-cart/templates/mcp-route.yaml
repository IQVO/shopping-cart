{{- if and .Values.mcp.enabled .Values.mcp.route.enabled -}}
{{- /*
MCP exposure through the gateway (Gateway API HTTPRoute).

Host contract: <mcp.route.path> (default /api/mcp/shopping-cart) -> Service
<release>-mcp:8090, prefix rewritten to /mcp (the SDK's canonical endpoint on
cmd/mcp; /healthz deliberately stays off the host - it is a Kubernetes probe
concern, not a public endpoint).

NO auth plugin or filter: endpoints are unauthenticated by fleet-wide decision
(access control is the in-cluster boundary).
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "shopping-cart.mcpFullname" . }}
  labels:
    {{- include "shopping-cart.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  parentRefs:
    {{- range .Values.mcp.route.parentRefs }}
    - name: {{ .name }}
      namespace: {{ .namespace }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName }}
      {{- end }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.mcp.route.path }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /mcp
      backendRefs:
        - name: {{ include "shopping-cart.mcpFullname" . }}
          port: {{ .Values.mcp.service.port }}
{{- end }}
