{{- if .Values.mcp.enabled }}
{{- include "shopping-cart.requireMcpPort" . }}
{{- include "shopping-cart.requireDatabase" . }}
{{- include "shopping-cart.requireCleanMcpExtraEnv" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shopping-cart.mcpFullname" . }}
  labels:
    {{- include "shopping-cart.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  replicas: {{ .Values.mcp.replicaCount }}
  selector:
    matchLabels:
      {{- include "shopping-cart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "shopping-cart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "shopping-cart.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mcp
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "shopping-cart.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/mcp"]
          ports:
            - name: http
              containerPort: {{ .Values.mcp.service.targetPort }}
              protocol: TCP
          # The env contract is cmd/mcp (main.go, telemetry.go): MCP_ADDR,
          # LOG_LEVEL, SERVICE_VERSION, OTEL_SERVICE_NAME,
          # OTEL_EXPORTER_OTLP_ENDPOINT, CART_CURRENCY, DATABASE_URL and (migration
          # step only) MIGRATIONS_DATABASE_URL: exactly the variables that binary
          # reads, and nothing else. This Deployment deliberately does NOT mount the
          # api ConfigMap: the server is read-only (ADR 0009), so it has no Kafka, no
          # outbox, no consumers, no schedulers and no delivery-promise client, and
          # none of those variables may reach it (tests/render_test.sh asserts it).
          env:
            - name: MCP_ADDR
              value: {{ .Values.mcp.httpAddr | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: SERVICE_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ printf "%s-mcp" .Values.otel.serviceName | quote }}
            {{- end }}
            {{- if ne (toString .Values.config.cartCurrency) "" }}
            # The estimate currency when no priced item states one: the SAME
            # value as the api, so every surface answers the same estimate.
            - name: CART_CURRENCY
              value: {{ .Values.config.cartCurrency | quote }}
            {{- end }}
            # MANDATORY: the same Postgres as the api (read side).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "shopping-cart.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- if .Values.database.migrationsExistingSecretKey }}
            # cmd/mcp applies the embedded migrations on start like the api
            # (idempotent; advisory-locked), so it needs the same direct DSN.
            # `optional: true`: the binary falls back to DATABASE_URL.
            - name: MIGRATIONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "shopping-cart.databaseSecretName" . }}
                  key: {{ .Values.database.migrationsExistingSecretKey }}
                  optional: true
            {{- end }}
            {{- range .Values.mcp.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          # GET /healthz is served by cmd/mcp, so every probe has a cheap target
          # (the binary exposes no /readyz: it has no drain gate).
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
          # The server writes nothing to disk and the root filesystem is
          # read-only; /tmp is a small scratch volume for the runtime.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
