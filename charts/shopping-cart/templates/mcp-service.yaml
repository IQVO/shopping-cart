{{- if .Values.mcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shopping-cart.mcpFullname" . }}
  labels:
    {{- include "shopping-cart.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  type: {{ .Values.mcp.service.type }}
  ports:
    - port: {{ .Values.mcp.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  # component=mcp pins the Service to the mcp Deployment's pods
  # (tests/test_service_selectors.py).
  selector:
    {{- include "shopping-cart.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
{{- end }}
